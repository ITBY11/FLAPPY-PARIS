<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 select-none overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flappy Bird - Édition Arcade Deluxe & Classement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      user-select: none;
      -webkit-user-select: none;
    }

    .pixel-text {
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
    }

    .game-shadow {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 4px #223;
    }

    /* Style du menu de classement par-dessus le jeu */
    .arcade-card {
      background: #ded895;
      border: 4px solid #554228;
      box-shadow: inset 0 0 0 2px #fbf7cb, 0 8px 24px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center bg-[#10141e] p-0 sm:p-4">

  <!-- Responsive Game Shell -->
  <main class="relative w-full h-full sm:h-auto sm:max-h-[92vh] sm:aspect-[9/16] sm:max-w-[420px] rounded-none sm:rounded-2xl overflow-hidden bg-black game-shadow flex items-center justify-center">
    
    <!-- Render Canvas -->
    <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

    <!-- Mute audio button in top-right -->
    <button id="muteBtn" class="absolute top-3 right-3 z-30 w-10 h-10 rounded-xl bg-black/50 border border-white/20 text-white flex items-center justify-center text-sm backdrop-blur hover:bg-black/70 active:scale-90 transition pointer-events-auto" title="Couper le son">
      🔊
    </button>

    <!-- Overlay de fin de partie avec Classement Cloud -->
    <div id="leaderboardOverlay" class="absolute inset-0 z-40 hidden flex-col items-center justify-center bg-black/75 backdrop-blur-sm p-4 text-center">
      <h2 class="text-xl sm:text-2xl text-red-500 mb-2 pixel-text">GAME OVER</h2>
      <p class="text-xs text-amber-300 mb-3 pixel-text">SCORE : <span id="overlayScore" class="text-white">0</span></p>

      <!-- Carte de saisie / classement rétro -->
      <div class="arcade-card w-full max-w-[320px] p-3 rounded text-black text-left mb-3">
        <!-- Zone enregistrement du score -->
        <div id="submitSection" class="flex flex-col gap-2 mb-3 pb-3 border-b-2 border-[#554228]">
          <input type="text" id="playerPseudo" placeholder="TON PSEUDO" maxlength="10" 
                 class="w-full p-2 bg-[#fbf7cb] border-2 border-[#554228] text-xs font-mono text-center text-black uppercase focus:outline-none placeholder-gray-500">
          <button id="saveScoreBtn" class="w-full py-2 bg-[#10b981] hover:bg-[#059669] text-white text-[10px] uppercase border-2 border-black active:scale-95 transition">
            ENREGISTRER SCORE
          </button>
        </div>

        <!-- Classements -->
        <div class="space-y-2">
          <div>
            <div class="text-[9px] text-[#ea580c] uppercase font-bold tracking-wider">🏆 TOP 3 ALL-TIME</div>
            <div id="topAllTime" class="text-[10px] mt-1 space-y-1 font-mono">Chargement...</div>
          </div>

          <div class="pt-2 border-t border-[#cbb86b]">
            <div class="text-[9px] text-[#ea580c] uppercase font-bold tracking-wider">⚡ MEILLEUR DU JOUR</div>
            <div id="topDay" class="text-[10px] mt-1 font-mono">Chargement...</div>
          </div>

          <div class="pt-2 border-t border-[#cbb86b]">
            <div class="text-[9px] text-[#ea580c] uppercase font-bold tracking-wider">📅 SEMAINE</div>
            <div id="topWeek" class="text-[10px] mt-1 font-mono">Chargement...</div>
          </div>
        </div>
      </div>

      <!-- Bouton Rejouer -->
      <button id="restartBtn" class="py-2.5 px-6 bg-[#e85c2c] hover:bg-[#ea580c] text-white text-xs border-2 border-black active:scale-95 transition shadow-lg">
        REJOUER
      </button>
    </div>

  </main>

  <script>
    // ==========================================
    // 1. INITIALISATION FIREBASE
    // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyCpFyGG7vnn8mnUuCqA_GegwY85GKHPnoc",
  authDomain: "flappy-paris.firebaseapp.com",
  projectId: "flappy-paris",
  storageBucket: "flappy-paris.firebasestorage.app",
  messagingSenderId: "649430283267",
  appId: "1:649430283267:web:1a1f58f108e213c6cd4a36",
  measurementId: "G-RLC6TBZY0H"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 2. MOTEUR AUDIO RÉTRO
    // ==========================================
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlap() {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(360, t);
        osc.frequency.exponentialRampToValueAtTime(740, t + 0.12);

        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playPoint() {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, t);
        osc.frequency.setValueAtTime(1318.51, t + 0.08);

        gain.gain.setValueAtTime(0.28, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      }

      playHit() {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.16);

        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.21);
      }

      playDie() {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(35, t + 0.3);

        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.33);
      }
    }

    const audio = new RetroAudio();
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? '🔇' : '🔊';
    });

    // ==========================================
    // 3. MOTEUR FLAPPY BIRD DELUXE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 288;
    const V_HEIGHT = 512;

    const STATES = {
      SPLASH: 0,
      READY: 1,
      PLAYING: 2,
      DEAD: 3,
      GAMEOVER: 4
    };

    const state = {
      current: STATES.READY,
      score: 0,
      bestScore: parseInt(localStorage.getItem('flappy_best') || '0'),
      groundX: 0,
      skyX: 0,
      cityX: 0,
      frame: 0,
      flashAlpha: 0,
      shake: 0,
      timeOfDay: 0
    };

    const GRAVITY = 0.26;
    const JUMP_FORCE = -5.4;
    const PIPE_SPEED = 1.8;
    const PIPE_SPAWN_INTERVAL = 95;
    const PIPE_GAP = 100;
    const GROUND_HEIGHT = 100;

    const bird = {
      x: 68,
      y: 220,
      w: 34,
      h: 24,
      vy: 0,
      rotation: 0,
      wingTimer: 0,
      wingFrame: 0,

      reset() {
        this.x = 68;
        this.y = 220;
        this.vy = 0;
        this.rotation = 0;
        this.wingTimer = 0;
        this.wingFrame = 0;
      },

      flap() {
        audio.init();
        this.vy = JUMP_FORCE;
        audio.playFlap();
        for (let i = 0; i < 4; i++) {
          particles.push({
            x: this.x - 4,
            y: this.y + 4 + Math.random() * 8,
            vx: -0.8 - Math.random() * 1.5,
            vy: (Math.random() - 0.5) * 1.2,
            size: 2.5 + Math.random() * 2,
            alpha: 1,
            color: '#ffffff'
          });
        }
      },

      update() {
        this.wingTimer++;
        if (this.wingTimer % 5 === 0) {
          this.wingFrame = (this.wingFrame + 1) % 4;
        }

        if (state.current === STATES.READY) {
          this.y = 220 + Math.sin(state.frame * 0.08) * 8;
          this.rotation = 0;
          return;
        }

        this.vy += GRAVITY;
        this.y += this.vy;

        if (this.vy < 0) {
          this.rotation = -0.45;
        } else {
          this.rotation += 0.045;
          if (this.rotation > 1.45) this.rotation = 1.45;
        }

        const groundLimit = V_HEIGHT - GROUND_HEIGHT - this.h / 2;
        if (this.y >= groundLimit) {
          this.y = groundLimit;
          if (state.current === STATES.PLAYING) {
            triggerDeath(true);
          }
        }
      }
    };

    let pipes = [];
    let particles = [];
    let pipeTimer = 0;

    function spawnPipe() {
      const minTopH = 50;
      const maxTopH = V_HEIGHT - GROUND_HEIGHT - PIPE_GAP - 50;
      const topHeight = minTopH + Math.floor(Math.random() * (maxTopH - minTopH));

      pipes.push({
        x: V_WIDTH + 10,
        topH: topHeight,
        bottomY: topHeight + PIPE_GAP,
        bottomH: V_HEIGHT - GROUND_HEIGHT - (topHeight + PIPE_GAP),
        w: 52,
        passed: false
      });
    }

    function checkCollision(pipe) {
      const birdBox = {
        left: bird.x - 12,
        right: bird.x + 12,
        top: bird.y - 9,
        bottom: bird.y + 9
      };

      const pipeLeft = pipe.x;
      const pipeRight = pipe.x + pipe.w;

      if (
        birdBox.right > pipeLeft &&
        birdBox.left < pipeRight &&
        birdBox.top < pipe.topH
      ) {
        return true;
      }

      if (
        birdBox.right > pipeLeft &&
        birdBox.left < pipeRight &&
        birdBox.bottom > pipe.bottomY
      ) {
        return true;
      }

      return false;
    }

    function triggerDeath(hitGround = false) {
      state.current = STATES.DEAD;
      state.shake = 16;
      state.flashAlpha = 0.85;

      audio.playHit();
      if (!hitGround) {
        setTimeout(() => audio.playDie(), 140);
      } else {
        audio.playDie();
      }

      for (let i = 0; i < 18; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4;
        particles.push({
          x: bird.x,
          y: bird.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 2 + Math.random() * 3,
          alpha: 1,
          color: Math.random() > 0.4 ? '#facc15' : '#ffffff'
        });
      }

      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('flappy_best', state.bestScore.toString());
      }

      setTimeout(() => {
        state.current = STATES.GAMEOVER;
        showLeaderboardOverlay();
      }, 550);
    }

    function drawSky() {
      state.timeOfDay = Math.min(2, Math.floor(state.score / 15));

      let skyTop, skyBot;
      if (state.timeOfDay === 0) {
        skyTop = '#4ec0ca';
        skyBot = '#93e6ec';
      } else if (state.timeOfDay === 1) {
        skyTop = '#2c3e6b';
        skyBot = '#e67e5a';
      } else {
        skyTop = '#090d1a';
        skyBot = '#172554';
      }

      const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT - GROUND_HEIGHT);
      grad.addColorStop(0, skyTop);
      grad.addColorStop(1, skyBot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT - GROUND_HEIGHT);

      if (state.timeOfDay === 2) {
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 16; i++) {
          const sx = (i * 47) % V_WIDTH;
          const sy = (i * 29) % 180;
          ctx.fillRect(sx, sy, 1.5, 1.5);
        }
      }

      ctx.fillStyle = state.timeOfDay === 0 ? '#b6e1be' : state.timeOfDay === 1 ? '#805b63' : '#1e293b';
      const cityW = 44;
      for (let i = 0; i < 9; i++) {
        const cx = (i * cityW - (state.cityX * 0.4) % cityW) - 10;
        const bldH = 40 + ((i * 23) % 45);
        ctx.fillRect(cx, V_HEIGHT - GROUND_HEIGHT - bldH, cityW - 4, bldH);
        ctx.fillStyle = state.timeOfDay === 2 ? '#fef08a' : 'rgba(255,255,255,0.4)';
        for (let w = 4; w < cityW - 8; w += 8) {
          for (let wy = 6; wy < bldH - 6; wy += 10) {
            ctx.fillRect(cx + w, V_HEIGHT - GROUND_HEIGHT - bldH + wy, 3, 4);
          }
        }
        ctx.fillStyle = state.timeOfDay === 0 ? '#b6e1be' : state.timeOfDay === 1 ? '#805b63' : '#1e293b';
      }

      ctx.fillStyle = state.timeOfDay === 0 ? '#86dc79' : state.timeOfDay === 1 ? '#60865c' : '#153a26';
      for (let h = 0; h < 6; h++) {
        const hx = (h * 70 - (state.cityX * 0.8) % 70) - 20;
        ctx.beginPath();
        ctx.arc(hx + 35, V_HEIGHT - GROUND_HEIGHT + 15, 45, Math.PI, 0);
        ctx.fill();
      }
    }

    function drawPipes() {
      pipes.forEach(p => {
        drawSinglePipe(p.x, 0, p.w, p.topH, true);
        drawSinglePipe(p.x, p.bottomY, p.w, p.bottomH, false);
      });
    }

    function drawSinglePipe(x, y, w, h, isTop) {
      const capHeight = 24;
      const capWidth = w + 6;
      const capX = x - 3;
      const capY = isTop ? y + h - capHeight : y;

      const bodyX = x;
      const bodyY = isTop ? y : y + capHeight;
      const bodyH = Math.max(0, h - capHeight);

      ctx.fillStyle = '#73be2e';
      ctx.fillRect(bodyX, bodyY, w, bodyH);

      ctx.fillStyle = '#9de64e';
      ctx.fillRect(bodyX + 3, bodyY, 6, bodyH);
      ctx.fillStyle = '#558022';
      ctx.fillRect(bodyX + w - 7, bodyY, 7, bodyH);

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.strokeRect(bodyX, bodyY, w, bodyH);

      ctx.fillStyle = '#73be2e';
      ctx.fillRect(capX, capY, capWidth, capHeight);

      ctx.fillStyle = '#9de64e';
      ctx.fillRect(capX + 4, capY, 7, capHeight);
      ctx.fillStyle = '#558022';
      ctx.fillRect(capX + capWidth - 9, capY, 9, capHeight);

      ctx.strokeRect(capX, capY, capWidth, capHeight);
    }

    function drawGround() {
      const gy = V_HEIGHT - GROUND_HEIGHT;

      ctx.fillStyle = '#73be2e';
      ctx.fillRect(0, gy, V_WIDTH, 14);

      ctx.fillStyle = '#9de64e';
      ctx.fillRect(0, gy, V_WIDTH, 3);

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(V_WIDTH, gy);
      ctx.moveTo(0, gy + 14);
      ctx.lineTo(V_WIDTH, gy + 14);
      ctx.stroke();

      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, gy + 14, V_WIDTH, GROUND_HEIGHT - 14);

      ctx.fillStyle = '#cbb86b';
      const stripeW = 16;
      const offset = state.groundX % (stripeW * 2);

      for (let x = -stripeW * 2; x < V_WIDTH + stripeW * 2; x += stripeW * 2) {
        ctx.beginPath();
        ctx.moveTo(x + offset, gy + 14);
        ctx.lineTo(x + offset + 10, gy + 14);
        ctx.lineTo(x + offset - 4, V_HEIGHT);
        ctx.lineTo(x + offset - 14, V_HEIGHT);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      ctx.fillStyle = '#f8c822';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fae158';
      ctx.beginPath();
      ctx.ellipse(-2, -3, 11, 7, -0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(7, -5, 6, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(8, -6, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e85c2c';
      ctx.beginPath();
      ctx.ellipse(13, 3, 7.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#000000';
      ctx.beginPath();
      ctx.moveTo(7, 3);
      ctx.lineTo(19, 3);
      ctx.stroke();

      const f = [0, 1, 2, 1][bird.wingFrame];
      const wingYOffset = (f - 1) * 4;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(-7, wingYOffset, 8, 5.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawScore() {
      if (state.current !== STATES.PLAYING) return;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.font = '32px "Press Start 2P", monospace';
      ctx.textAlign = 'center';

      const txt = state.score.toString();
      ctx.strokeText(txt, V_WIDTH / 2, 70);
      ctx.fillText(txt, V_WIDTH / 2, 70);
    }

    function drawReadyScreen() {
      if (state.current !== STATES.READY) return;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.font = '20px "Press Start 2P", monospace';
      ctx.textAlign = 'center';

      ctx.strokeText('GET READY!', V_WIDTH / 2, 140);
      ctx.fillText('GET READY!', V_WIDTH / 2, 140);

      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = '#facc15';
      ctx.strokeText('TAP OU ESPACE', V_WIDTH / 2, 320);
      ctx.fillText('TAP OU ESPACE', V_WIDTH / 2, 320);

      ctx.fillStyle = '#ffffff';
      ctx.font = '9px "Press Start 2P", monospace';
      const blink = Math.floor(state.frame / 20) % 2 === 0;
      if (blink) {
        ctx.fillText('POUR VOLER', V_WIDTH / 2, 345);
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.035;

        if (pt.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;
    }

    function update() {
      state.frame++;

      if (state.flashAlpha > 0) state.flashAlpha -= 0.05;
      if (state.shake > 0) state.shake *= 0.84;

      if (state.current === STATES.READY || state.current === STATES.PLAYING) {
        state.groundX += PIPE_SPEED;
        state.cityX += PIPE_SPEED * 0.35;
      }

      bird.update();

      if (state.current === STATES.PLAYING) {
        pipeTimer++;
        if (pipeTimer >= PIPE_SPAWN_INTERVAL) {
          spawnPipe();
          pipeTimer = 0;
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          if (!p.passed && p.x + p.w < bird.x) {
            p.passed = true;
            state.score++;
            audio.playPoint();
          }

          if (checkCollision(p)) {
            triggerDeath(false);
            break;
          }

          if (p.x < -p.w - 10) {
            pipes.splice(i, 1);
          }
        }
      }
    }

    function render() {
      ctx.save();

      if (state.shake > 0.5) {
        const sx = (Math.random() - 0.5) * state.shake;
        const sy = (Math.random() - 0.5) * state.shake;
        ctx.translate(sx, sy);
      }

      drawSky();
      drawPipes();
      drawGround();
      drawBird();
      drawParticles();
      drawScore();
      drawReadyScreen();

      if (state.flashAlpha > 0.01) {
        ctx.fillStyle = `rgba(255, 255, 255, ${state.flashAlpha})`;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function handleAction() {
      if (state.current === STATES.READY) {
        state.current = STATES.PLAYING;
        bird.flap();
      } else if (state.current === STATES.PLAYING) {
        bird.flap();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (state.current !== STATES.GAMEOVER) {
          e.preventDefault();
          handleAction();
        }
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      if (state.current !== STATES.GAMEOVER) {
        e.preventDefault();
        handleAction();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      if (state.current !== STATES.GAMEOVER) {
        e.preventDefault();
        handleAction();
      }
    }, { passive: false });

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = V_WIDTH * dpr;
      canvas.height = V_HEIGHT * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resize);

    // ==========================================
    // 4. GESTION DU CLASSEMENT EN LIGNE
    // ==========================================
    const overlay = document.getElementById('leaderboardOverlay');
    const overlayScore = document.getElementById('overlayScore');
    const pseudoInput = document.getElementById('playerPseudo');
    const saveScoreBtn = document.getElementById('saveScoreBtn');
    const submitSection = document.getElementById('submitSection');
    const restartBtn = document.getElementById('restartBtn');

    if (localStorage.getItem('flappy_pseudo')) {
      pseudoInput.value = localStorage.getItem('flappy_pseudo');
    }

    function showLeaderboardOverlay() {
      overlayScore.textContent = state.score;
      submitSection.classList.remove('hidden');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      loadLeaderboards();
    }

    saveScoreBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const pseudo = pseudoInput.value.trim().toUpperCase() || 'ANONYME';
      localStorage.setItem('flappy_pseudo', pseudo);

      saveScoreBtn.disabled = true;
      saveScoreBtn.textContent = 'ENVOI...';

      try {
        await db.collection("flappy_scores").add({
          pseudo: pseudo,
          score: state.score,
          timestamp: Date.now()
        });
        submitSection.classList.add('hidden');
        await loadLeaderboards();
      } catch (err) {
        console.error(err);
        alert("Erreur d'envoi. Vérifie que le mode test est activé sur Firestore !");
      } finally {
        saveScoreBtn.disabled = false;
        saveScoreBtn.textContent = 'ENREGISTRER SCORE';
      }
    });

    async function loadLeaderboards() {
      try {
        const snapshot = await db.collection("flappy_scores").orderBy("score", "desc").limit(50).get();
        const scores = [];
        snapshot.forEach(doc => scores.push(doc.data()));

        const now = new Date();
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayOfWeek = now.getDay() || 7;
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1).getTime();

        // 1. Top 3 All-Time
        const top3 = scores.slice(0, 3);
        const medalColors = ['text-yellow-600', 'text-gray-500', 'text-amber-700'];
        let top3Html = '';
        top3.forEach((s, idx) => {
          top3Html += `<div class="flex justify-between font-bold ${medalColors[idx]}"><span>${idx + 1}. ${s.pseudo}</span><span>${s.score}</span></div>`;
        });
        document.getElementById('topAllTime').innerHTML = top3Html || '<div class="text-gray-600">AUCUN SCORE</div>';

        // 2. Meilleur du Jour
        const todayScores = scores.filter(s => s.timestamp >= startOfDay);
        if (todayScores.length > 0) {
          document.getElementById('topDay').innerHTML = `<div class="flex justify-between font-bold text-yellow-700"><span>1. ${todayScores[0].pseudo}</span><span>${todayScores[0].score}</span></div>`;
        } else {
          document.getElementById('topDay').innerHTML = '<div class="text-gray-600">PAS DE SCORE</div>';
        }

        // 3. Meilleur de la Semaine
        const weekScores = scores.filter(s => s.timestamp >= startOfWeek);
        if (weekScores.length > 0) {
          document.getElementById('topWeek').innerHTML = `<div class="flex justify-between font-bold text-gray-700"><span>1. ${weekScores[0].pseudo}</span><span>${weekScores[0].score}</span></div>`;
        } else {
          document.getElementById('topWeek').innerHTML = '<div class="text-gray-600">PAS DE SCORE</div>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      state.score = 0;
      pipes = [];
      particles = [];
      pipeTimer = 0;
      bird.reset();
      state.current = STATES.READY;
    });

    window.addEventListener('DOMContentLoaded', () => {
      resize();
      gameLoop();
    });
  </script>
</body>
</html>
